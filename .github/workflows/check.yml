# =============================================================================
# CI do evtol-dev — o repositório que não tinha CI, e por isso quebrou tudo.
# =============================================================================
#
# POR QUE ESTE ARQUIVO EXISTE
#
# Este repositório não tem código compilável: tem o manifesto, os perfis de
# ambiente e os scripts que TODA máquina do time usa para carregar o ROS,
# compilar e simular. Justamente por não ter código, ficou sem CI.
#
# O preço apareceu de uma vez. Quando os perfis ganharam herança (`extends`) e
# `ros.distro` passou a morar na base comum, o `doctor.py` aprendeu a resolver
# a herança e o `ros_env.sh` e o `setup.sh` — que tinham parsers de YAML
# próprios — não. O resultado: TODA task do VSCode passou a falhar com
#
#     ros_env.sh: o perfil 'desktop-humble' não declara ros.distro.
#
# enquanto o `./doctor.sh` seguia dizendo que estava tudo certo.
#
# Os testes abaixo são baratos e teriam pego isso no PR.
# =============================================================================

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Empurrar de novo cancela o run anterior em vez de enfileirar atras dele.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: manifesto, perfis e scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml shellcheck

      - name: Sintaxe dos scripts de shell
        run: |
          erros=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::erro de sintaxe"; erros=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $erros

      - name: Sintaxe dos scripts de Python
        run: |
          erros=0
          while IFS= read -r f; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "::error file=$f::erro de sintaxe"; erros=1; }
          done < <(find . -name '*.py' -not -path './.git/*')
          exit $erros

      - name: Todo YAML analisa
        run: |
          erros=0
          while IFS= read -r f; do
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::YAML invalido"; erros=1; }
          done < <(find . \( -name '*.yaml' -o -name '*.yml' \) -not -path './.git/*')
          exit $erros

      # -----------------------------------------------------------------------
      # O teste que teria pego a quebra das tasks.
      #
      # Todo perfil selecionavel PRECISA resolver os campos que os scripts leem.
      # Se um deles passar a vir por heranca e algum leitor nao souber resolver,
      # isto falha aqui em vez de falhar na maquina de quem for compilar.
      # -----------------------------------------------------------------------
      - name: Cada perfil resolve os campos que os scripts usam
        run: |
          perfis=$(python3 env/doctor.py --list | tail -n +2 | awk '{print $1}')
          [ -n "$perfis" ] || { echo "::error::nenhum perfil encontrado"; exit 1; }
          erros=0
          for p in $perfis; do
            for campo in ros.distro os.python os.release; do
              valor=$(python3 env/doctor.py --get "$campo" --profile "$p" 2>&1) || {
                echo "::error::perfil '$p' nao resolve '$campo': $valor"
                erros=1
                continue
              }
              echo "  $p  $campo = $valor"
            done
          done
          exit $erros

      # O --current responde "em qual perfil eu estou". Se ele quebrar, quem
      # descobre e alguem depurando um voo.
      - name: O doctor sabe dizer qual perfil esta em uso
        run: |
          erros=0
          # O --list agora marca o perfil atual com '*'; o sed o remove.
          for p in $(python3 env/doctor.py --list | tail -n +2 | sed 's/^[* ] *//' | awk '{print $1}'); do
            nome=$(python3 env/doctor.py --current --curto --profile "$p") || {
              echo "::error::--current falhou para o perfil '$p'"; erros=1; continue; }
            [ "$nome" = "$p" ] || {
              echo "::error::--current devolveu '$nome' para o perfil '$p'"; erros=1; }
            python3 env/doctor.py --current --profile "$p" >/dev/null || {
              echo "::error::--current (longo) falhou para '$p'"; erros=1; }
          done
          # Sem perfil nenhum: tem de sair com erro, e nao com um nome errado.
          if python3 env/doctor.py --current --curto >/dev/null 2>&1; then
            echo "  (ha um .evtol-profile no repositorio? nao deveria)"
          fi
          exit $erros

      # Nao roda o sync_tasks.py (precisa do colcon e do src/): confere que o
      # tasks.json e JSON valido, que todo ${input:...} existe, e que nenhuma
      # cadeia de dependsOn pergunta o mesmo input duas vezes.
      - name: As tasks do VS Code sao coerentes
        run: |
          python3 - <<'PY'
          import json, re, sys

          texto = open(".vscode/tasks.json", encoding="utf-8").read()
          dados = json.loads(re.sub(r"^\s*//.*$", "", texto, flags=re.M))

          tasks = {t["label"]: t for t in dados["tasks"]}
          inputs = {i["id"] for i in dados["inputs"]}
          falhas = []

          def citados(label, pilha=()):
              if label in pilha:
                  falhas.append(f"ciclo de dependsOn em '{label}'")
                  return []
              t = tasks.get(label)
              if t is None:
                  falhas.append(f"dependsOn aponta para task inexistente: '{label}'")
                  return []
              saida = []
              for dep in t.get("dependsOn", []):
                  saida += citados(dep, pilha + (label,))
              saida += re.findall(r"\$\{input:(\w+)\}", t.get("command", ""))
              return saida

          for label in tasks:
              vistos = citados(label)
              for nome in set(vistos):
                  if nome not in inputs:
                      # Sem chave-dupla-cifrao literal aqui: o GitHub Actions
                      # a le como delimitador de expressao e RECUSA o workflow
                      # inteiro -- "workflow file issue", nenhum passo roda.
                      # Concatenar evita a sequencia.
                      falhas.append(
                          "'" + label + "' usa ${input:" + nome + "}, que nao existe")
                  # O VS Code resolve os inputs POR TASK. Duas tasks da mesma
                  # cadeia citando o mesmo input = duas perguntas iguais.
                  if vistos.count(nome) > 1:
                      falhas.append(
                          f"'{label}' pergunta '{nome}' {vistos.count(nome)} vezes")

          for f in falhas:
              print(f"::error::{f}")
          sys.exit(1 if falhas else 0)
          PY

      # -----------------------------------------------------------------------
      # O manifesto e a razao de ser deste repositorio. Um pin que aponta para
      # uma referencia inexistente so aparece quando alguem monta o workspace.
      # -----------------------------------------------------------------------
      - name: Toda versao do evtol.repos existe no remoto
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, tempfile, yaml

          # O manifesto aceita tres formas, e a checagem precisa das tres:
          #
          #   BRANCH  os repositorios da equipe acompanham a `main`
          #   TAG     os de terceiros (px4_msgs v1.15.4, behaviortree 4.9.1)
          #   HASH    um voo.repos congelado, ou um repo sem tag nenhuma
          #
          # Historico desta checagem: a primeira versao so sabia resolver tag
          # (`ls-remote --tags`) e reprovava pin por hash; agora um pin por
          # branch reprovaria do mesmo jeito. Cada forma tem o seu jeito de
          # perguntar ao remoto.
          HASH = re.compile(r"^[0-9a-f]{40}$")

          def existe(url, versao):
              if HASH.match(versao):
                  # Nao da para perguntar por um commit com ls-remote. A forma
                  # barata e buscar so ele, com profundidade 1.
                  with tempfile.TemporaryDirectory() as tmp:
                      subprocess.run(["git", "init", "-q", tmp], check=True)
                      out = subprocess.run(
                          ["git", "-C", tmp, "fetch", "-q", "--depth", "1",
                           url, versao],
                          capture_output=True, text=True, timeout=180)
                      return out.returncode == 0, "hash"
              for flag, tipo in (("--heads", "branch"), ("--tags", "tag")):
                  out = subprocess.run(
                      ["git", "ls-remote", flag, "--refs", url, versao],
                      capture_output=True, text=True, timeout=90)
                  if out.stdout.strip():
                      return True, tipo
              return False, "?"

          repos = yaml.safe_load(open("evtol.repos"))["repositories"]
          falhas = []
          for nome, r in sorted(repos.items()):
              versao = str(r["version"])
              ok, tipo = existe(r["url"], versao)
              print(f"  {'OK  ' if ok else 'FALTA'} {nome:<22} {tipo:<6} {versao}")
              if not ok:
                  falhas.append(f"{nome} {versao}")
          if falhas:
              print(f"::error::versoes inexistentes: {', '.join(falhas)}")
              sys.exit(1)
          print(f"{len(repos)} repositorios, todas as versoes resolvem.")
          PY

      - name: shellcheck (informativo)
        continue-on-error: true
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning || true

  # ---------------------------------------------------------------------------
  # O docs/CONTRATOS.md e GERADO do codigo. Antes, o CI so conferia se ele
  # estava em dia e REPROVAVA o pull request quando nao estava -- cobrando de
  # um humano um trabalho que e de robo, e sem dizer o que fazer alem de "rode
  # o script".
  #
  # O caso que motivou a mudanca: o pin do vision_geometry dizia
  # `v0.1.2  # bloco-ancora do frame otico da camera`, mas o bloco so entrou na
  # main DEPOIS da tag. O CI lia a tag, nao via o bloco, e reprovava um
  # CONTRATOS.md que estava certo do ponto de vista de quem o gerou. Ficou
  # vermelho por semanas e ninguem conseguia ver por que.
  #
  # Agora o job regenera e COMMITA no proprio branch do pull request. Se nada
  # mudou, nao faz nada.
  #
  # Nao roda em pull request vindo de fork (nao ha permissao de escrita) nem
  # direto na main (a protecao de branch recusa, e corretamente).
  # ---------------------------------------------------------------------------
  contratos:
    name: CONTRATOS.md (regenerado pelo bot)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 -m pip install --quiet vcstool

      - name: Importar o workspace
        run: |
          # O `src/` e gitignorado: nao existe no checkout, e o `vcs import`
          # recusa um caminho inexistente ("Path 'src' does not exist"). A
          # ausencia deste mkdir deixou a main deste repositorio vermelha por
          # 15 runs seguidos. O setup.sh sempre teve o mkdir; o CI nao.
          mkdir -p src
          vcs import --shallow src < evtol.repos

      - name: Regenerar e commitar se mudou
        run: |
          python3 scripts/contratos.py
          if git diff --quiet -- docs/CONTRATOS.md; then
            echo "docs/CONTRATOS.md ja estava em dia."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONTRATOS.md
          git commit -m "docs: regenera o CONTRATOS.md (bot)"
          git push
          echo "::notice::docs/CONTRATOS.md estava defasado; o bot regenerou e commitou no branch."
