# =============================================================================
# CI — compila este repositório contra o workspace, em Humble.
# =============================================================================
#
# Por que existe: sem CI, "a main compila" é uma crença, não um fato.
#
# POR QUE SÓ HUMBLE AQUI. O time voa com duas distros — Jetson (Humble) e
# Raspberry Pi (Jazzy). A versão anterior deste arquivo exigia as duas em todo
# PR, mais um job de lint que recompilava o mundo uma terceira vez: 14 a 26
# minutos de espera para aprovar uma correção de uma linha. O Jazzy passou a
# ser verificado uma vez por dia, no workflow `noturno` do evtol-dev, que
# compila o workspace INTEIRO — cobertura maior do que a daqui, e a deriva
# Humble-only aparece em até 24h em vez de cair no PR de quem não a causou.
#
# As versões das dependências vêm do `evtol.repos` do evtol-dev. Como ele hoje
# acompanha a `main` dos repositórios da equipe, este CI responde à pergunta
# certa: "este repositório funciona com o workspace que o time tem AGORA?"
# =============================================================================

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Empurrar de novo cancela o run anterior em vez de enfileirar atrás dele.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sem variável de pacote: os pacotes deste repositório são descobertos com
# `colcon list`. Assim o mesmo arquivo serve a repositórios de um pacote só
# (drone_lib, stdstates) e a repositórios com vários (fsm, cv_nodes).

jobs:
  build:
    name: build (humble)
    runs-on: ubuntu-latest
    container: ros:humble-ros-base

    env:
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates ccache \
            python3-vcstool python3-colcon-common-extensions python3-yaml

      - name: Clonar este repositório em src/
        uses: actions/checkout@v5
        with:
          path: src/${{ github.event.repository.name }}

      - name: Buscar o manifesto do workspace
        run: |
          curl -fsSL -o evtol.repos \
            https://raw.githubusercontent.com/Equipe-eVTOL-ITA/evtol-dev/main/evtol.repos

      # NAO HA CACHE DE ROSDEP AQUI, de proposito. A primeira versao deste
      # arquivo cacheava /root/.ros/rosdep e salvava ZERO byte; a segunda
      # tentou /github/home/.ros/rosdep e salvou zero de novo. Medindo o log em
      # vez de adivinhar o caminho: o `rosdep update` leva 3 SEGUNDOS. Os ~80s
      # do passo sao o `rosdep install` rodando apt-get, que nenhum cache de
      # sources.cache toca. Cachear apt e outro problema, e nao vale a
      # complexidade aqui.

      # O ganho real. Sem ccache, todo run recompila o workspace inteiro do
      # zero; com ele, só o que mudou de fato.
      #
      # NÃO existe cache dos clones de src/: o evtol.repos acompanha a `main`
      # dos repositórios da equipe, então o hash do manifesto NÃO muda quando o
      # código muda. Uma chave de cache baseada nele serviria dependência
      # velha, silenciosamente — exatamente a classe de bug que o manifesto
      # veio evitar.
      # ESCOPO. Um cache gravado num run de pull request fica em
      # refs/pull/N/merge, e um gravado num run de branch fica em
      # refs/heads/<branch>: os dois NAO se enxergam. So o cache da
      # `main` e legivel por todos. Ou seja: o primeiro run de um PR
      # novo e sempre frio, e o ganho aparece do segundo em diante --
      # e depois que este workflow tiver rodado uma vez na main.
      - name: Cache do ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-humble-${{ github.sha }}
          restore-keys: |
            ccache-humble-

      - name: Importar dependências
        run: |
          # Remove a própria entrada: este repositório vem do checkout acima,
          # na revisão do PR — não do que estiver no manifesto.
          python3 - <<'PY'
          import yaml
          m = yaml.safe_load(open("evtol.repos"))
          m["repositories"].pop("${{ github.event.repository.name }}", None)
          yaml.safe_dump(m, open("deps.repos", "w"))
          PY
          mkdir -p src
          vcs import --shallow src < deps.repos

      - name: rosdep
        run: |
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble || \
            echo "::warning::rosdep reportou erros; seguindo para o build"

      - name: Compilar
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          pkgs=$(colcon list --names-only --base-paths "src/${{ github.event.repository.name }}" | tr '\n' ' ')
          echo "Pacotes deste repositório: $pkgs"
          [ -n "$pkgs" ] || { echo "::error::nenhum pacote colcon encontrado"; exit 1; }
          colcon build --packages-up-to $pkgs \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                         -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                         -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Quantos acertos o cache teve. Se ficar perto de zero run após run, a
      # chave está errada e alguém precisa olhar.
      - name: Aproveitamento do ccache
        if: always()
        run: ccache --show-stats
