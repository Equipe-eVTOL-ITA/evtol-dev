# =============================================================================
# Perfil de ambiente: desktop-humble
# =============================================================================
# Máquina de DESENVOLVIMENTO e SIMULAÇÃO (PX4 SITL + Gazebo).
#
# Este arquivo é o contrato de AMBIENTE. Ele pina o que o `evtol.repos` não
# consegue pinar: distro do ROS, versão do Gazebo, variante do bridge, PX4,
# pacotes apt e pip.
#
# Verifique sua máquina contra este perfil com:
#     ./doctor.sh --profile desktop-humble
#
# Como editar: mude um valor aqui SÓ quando a mudança for intencional e
# validada em voo/simulação. Um valor mudado por acidente aqui é exatamente
# o bug que este arquivo existe para impedir.
#
# Os valores foram capturados de uma máquina comprovadamente funcional em
# 2026-08-09. Os comentários "verificado:" registram a versão exata observada;
# o valor enforçado é um glob deliberadamente mais frouxo, para não quebrar a
# cada patch de segurança do apt. O que está pinado com precisão é sempre o
# que distingue uma variante INCOMPATÍVEL de uma compatível.
# =============================================================================

# O que vale para toda máquina Humble do time (SO, ROS, setuptools, packaging,
# numpy) mora em _common-humble.yaml. Aqui fica só o que distingue a máquina de
# desenvolvimento e de solo: a stack de simulação e a de visão por gestos.
extends: _common-humble

profile: desktop-humble
description: Desenvolvimento e estacao de solo — PX4 SITL + Gazebo Garden + gestos
simulation: true

# -----------------------------------------------------------------------------
# Pacotes apt
# -----------------------------------------------------------------------------
apt:

  required:
    # --- Gazebo Garden ---------------------------------------------------
    # O `Tools/setup/ubuntu.sh` do PX4 v1.15.4 instala `gz-garden`. Não é
    # escolha nossa: está no código do PX4. Toda a stack de simulação tem que
    # ser da mesma safra (Garden = gz-sim7 + gz-transport12).
    gz-garden: "1.*"                      # verificado: 1.0.0-1~jammy
    gz-sim7-cli: "7.*"                    # verificado: 7.9.0-1~jammy
    libgz-sim7: "7.*"                     # verificado: 7.9.0-1~jammy
    libgz-transport12: "12.*"             # verificado: 12.2.2-1~jammy

    # --- Bridge ROS <-> Gazebo -------------------------------------------
    # ATENÇÃO: este é o ponto que já custou dias de depuração ao time.
    #
    # O bridge precisa ser compilado contra a MESMA versão do gz-transport que
    # o Gazebo usa. Para Humble + Garden, o pacote é `ros-humble-ros-gzGARDEN-*`.
    # O nome "óbvio" — `ros-humble-ros-gz-*`, sem sufixo — é compilado contra
    # FORTRESS (gz-transport11) e é a armadilha: instala sem erro, executa sem
    # erro, e simplesmente não enxerga tópico nenhum do Gazebo. Falha silenciosa.
    #
    # Veja a lista `forbidden` abaixo.
    ros-humble-ros-gzgarden-image: "0.244.*"        # verificado: 0.244.11-1002jammy
    ros-humble-ros-gzgarden-bridge: "0.244.*"       # verificado: 0.244.11-1002jammy
    ros-humble-ros-gzgarden-sim: "0.244.*"          # verificado: 0.244.11-1002jammy
    ros-humble-ros-gzgarden-interfaces: "0.244.*"   # verificado: 0.244.11-1002jammy

    # --- ROS / build ------------------------------------------------------
    ros-humble-desktop: "*"
    python3-colcon-common-extensions: "*"
    python3-vcstool: "*"
    python3-rosdep: "*"
    ros-humble-vision-msgs: "*"
    ros-humble-cv-bridge: "*"

  forbidden:
    # --- Behavior Trees ---------------------------------------------------
    # O BehaviorTree.CPP vem da FONTE, pelo evtol.repos, e não do apt.
    ros-humble-behaviortree-cpp: >-
      O pacote apt da v4 (4.9.1) está QUEBRADO: instala a biblioteca em
      lib/x86_64-linux-gnu/ enquanto o ament_cmake_export_libraries dele a
      procura em lib/. O próprio find_package(behaviortree_cpp) aborta com
      "exports the library 'behaviortree_cpp' which couldn't be found".
      Verificado nesta máquina e no CI. O workspace compila da fonte, pinado
      no evtol.repos; ter o do apt instalado só reintroduz a ambiguidade.
    ros-humble-behaviortree-cpp-v3: >-
      É a v3, com API incompatível com a v4 que o `stdbt` usa. O nome com
      sufixo parece o mais recente e é o contrário: o pacote sem sufixo é que
      traz a v4. Não instale nenhum dos dois: o workspace compila da fonte.

    # Instalar qualquer um destes junto com o Garden quebra a simulação EM
    # SILÊNCIO. O valor é a explicação mostrada quando o doctor encontra o
    # pacote instalado.
    ros-humble-ros-gz-image: >-
      Variante FORTRESS (gz-transport11) do bridge. Com Gazebo Garden instalado
      ela roda mas NÃO enxerga nenhum tópico do Gazebo — sem mensagem de erro.
      Use ros-humble-ros-gzgarden-image.
    ros-humble-ros-gz-bridge: >-
      Variante FORTRESS do parameter_bridge. Mesmo problema.
      Use ros-humble-ros-gzgarden-bridge.
    ros-humble-ros-gz-sim: >-
      Variante FORTRESS. Use ros-humble-ros-gzgarden-sim.
    ros-humble-ros-gzharmonic-image: >-
      Variante HARMONIC (gz-transport13). O PX4 v1.15.4 instala Garden, não
      Harmonic. Use ros-humble-ros-gzgarden-image.
    gz-harmonic: >-
      Gazebo Harmonic conflita com o Garden que o PX4 v1.15.4 instala.

# -----------------------------------------------------------------------------
# Pacotes pip
# -----------------------------------------------------------------------------
# O valor esperado aceita duas formas:
#   glob        "4.11.*"   — casamento de texto
#   restrição   "<80"      — comparação numérica de versão
pip:
  required:
    # opencv-python: 4.11.0.86.
    #
    # O TETO é imposto pelo numpy: a partir do 4.12 o pacote EXIGE numpy >= 2,
    # que é justamente o que quebra o cv_bridge acima. As duas coisas são
    # mutuamente exclusivas. Medido em venvs limpos:
    #
    #     4.10.0.84 + numpy<2 -> OK
    #     4.11.0.86 + numpy<2 -> OK      <- o mais novo que serve
    #     4.12.0.88 + numpy<2 -> ResolutionImpossible
    #     4.13.0.92 + numpy<2 -> ResolutionImpossible
    #
    # (Esta máquina está hoje com 4.13.0.92 + numpy 2.2.6 — a combinação
    # impossível. É a causa do cv_bridge quebrado aqui.)
    #
    # O PISO é a API do ArUco, que mudou de forma incompatível no 4.7
    # (ArucoDetector). Nosso código usa a API nova.
    #
    # A wheel é abi3 (tag cp37), então a MESMA versão serve ao Python 3.10 do
    # Humble e ao 3.12 do Jazzy — que é o que permite máquina de dev e drone
    # rodarem exatamente o mesmo OpenCV.
    #
    # Validado no 4.11.0.86: detecção de marcador ArUco ponta a ponta e
    # cv_bridge.imgmsg_to_cv2 com numpy 1.26.4.
    #
    # POR QUE `contrib` E NÃO O `opencv-python` PURO.
    #
    # Os dois instalam o mesmo módulo `cv2` e não podem coexistir — quem vale
    # passa a depender da ordem de instalação. Até a fase 1 o workspace usava o
    # `opencv-python` e listava o `contrib` como proibido.
    #
    # A fase 3 inverte isso, porque o `mediapipe` DEPENDE de
    # `opencv-contrib-python` (verificado no metadado de todas as versões com
    # wheel para aarch64). Tentar manter o `opencv-python` significaria ter os
    # dois instalados, que é exatamente o cenário que a proibição existe para
    # evitar.
    #
    # A troca é segura: o `contrib` é um superconjunto — mesma versão, mesma
    # wheel abi3 (cp37, serve ao Python 3.10 do Humble e ao 3.12 do Jazzy),
    # mesmos módulos, mais os extras. Nenhum código do time perde nada.
    #
    # Resolução verificada em venv limpo (2026-08-12):
    #     mediapipe==0.10.18 + opencv-contrib-python==4.11.0.86 + numpy>=1.24,<2
    #     -> numpy-1.26.4, sem conflito
    opencv-contrib-python: "4.11.0.86"

    # ---------------------------------------------------------------------
    # mediapipe: 0.10.18. A versão NÃO é arbitrária.
    #
    # Duas condições precisam valer ao mesmo tempo, e só uma faixa estreita de
    # versões satisfaz as duas:
    #
    #   1. TER WHEEL PARA aarch64. A Jetson Orin Nano e a Raspberry Pi são
    #      aarch64, e é nelas que a fase 3 voa.
    #   2. FIXAR numpy < 2 ELA PRÓPRIA. Se o mediapipe deixa o numpy solto, uma
    #      reinstalação futura pode trazer o numpy 2 e matar o cv_bridge — com
    #      o SystemError sem menção a numpy descrito acima.
    #
    # Medido no PyPI (2026-08-12):
    #
    #     versao    aarch64?  numpy
    #     1.0.0     SIM       solto      <- arrisca puxar numpy 2
    #     0.10.35   nao       solto
    #     0.10.21   nao       <2         <- roda no desktop, FALHA no drone
    #     0.10.20   nao       <2
    #     0.10.18   SIM       <2         <- a mais nova que serve
    #     0.10.15   SIM       <2
    #
    # A 0.10.21 é a armadilha: passaria em qualquer teste feito na máquina de
    # desenvolvimento e só falharia ao instalar no drone.
    #
    # Wheels da 0.10.18: cp39, cp310, cp311, cp312 para manylinux x86_64 E
    # aarch64 — cobre desktop, Jetson e Raspberry, nos dois distros.
    #
    # ATENÇÃO ao peso: o mediapipe arrasta jax, jaxlib, scipy, matplotlib,
    # sentencepiece e sounddevice. Numa Raspberry isso é significativo em disco
    # e em tempo de instalação. Instale só nos perfis que rodam gestos.
    mediapipe: "0.10.18"

  forbidden:
    opencv-python: >-
      Conflita com opencv-contrib-python: os dois instalam o mesmo módulo `cv2`
      e o que vale passa a depender da ordem de instalação. O workspace usa o
      `contrib` porque o mediapipe (fase 3) depende dele, e porque o contrib é
      superconjunto — trocar não custa nada a quem não usa os extras.
      Se este pacote estiver instalado junto com o contrib, DESINSTALE-O.

# -----------------------------------------------------------------------------
# Binários que precisam estar no PATH
# -----------------------------------------------------------------------------
commands:
  gz:
    version_cmd: "gz sim --version"
    version_regex: "version (\\S+)"
    expect_version: "7.*"                 # verificado: 7.9.0 (Garden)
    fix: "sudo apt install gz-garden"

  MicroXRCEAgent:
    expect_path: /usr/local/bin/MicroXRCEAgent
    fix: "Veja docs/SETUP.md seção 5 (compilar e `sudo make install`)."

  colcon: {}
  vcs:
    fix: "sudo apt install python3-vcstool"
  rosdep:
    fix: "sudo apt install python3-rosdep"

# -----------------------------------------------------------------------------
# Repositórios externos ao workspace colcon
# -----------------------------------------------------------------------------
# Não entram no evtol.repos porque não são pacotes ROS e não vivem em src/.
# Continuam sendo dependências duras da simulação — e portanto pinadas aqui.
git_repos:
  ~/PX4-Autopilot:
    expect_describe: "v1.15.4"
    fix: "git -C ~/PX4-Autopilot fetch --tags && git -C ~/PX4-Autopilot checkout v1.15.4"

  ~/PX4-gazebo-models:
    expect_commit: "492352b"
    # O QUE ESTE COMMIT PRECISA CONTER, dito em palavras.
    #
    # O hash sozinho ja garantiria, mas ele nao EXPLICA: quando falha, a
    # mensagem e "no commit abc, esperado def", e quem le nao sabe o que esta
    # faltando nem por que aquilo importa.
    #
    # O `wanda` e o drone da fase 4. O x500 NAO SERVE ali: ele tem 0,772 m de
    # envergadura e as janelas do labirinto tem 0,60 m -- faltam 8,6 cm de cada
    # lado, e nao e apertado, e impossivel. Sem este modelo a fase 4 nao sobe.
    expect_paths:
      - models/wanda/model.sdf
      - tools/gerar_wanda.py
    fix: "git -C ~/PX4-gazebo-models fetch && git -C ~/PX4-gazebo-models checkout 492352b"

  ~/Micro-XRCE-DDS-Agent:
    # Verificado v3.0.1 na máquina que funciona.
    # (O PR #2 do evtol-dev propunha pinar v2.4.3; isso NÃO corresponde ao que
    # está em uso e voando. Se algum dia houver motivo para voltar ao 2.x, a
    # mudança tem que ser validada em simulação antes de entrar aqui.)
    expect_describe: "v3.0.1"
    fix: "git -C ~/Micro-XRCE-DDS-Agent checkout v3.0.1 && recompilar (docs/SETUP.md seção 5)"

# ─────────────────────────────────────────────────────────────────────────────
# QGroundControl — OPCIONAL, e por maquina.
#
# O `scripts/qgc.sh` procura o AppImage nos lugares onde ele costuma parar
# (~/Apps, ~/Downloads/apps, ~/Downloads, /opt, ...) e, nesta maquina, o acha
# sozinho. Esta chave existe para o caso em que ele nao acha -- porque a
# maquina o guarda em outro lugar.
#
# Fica no PERFIL, e nao num script, pela mesma razao que a distro do ROS fica:
# e informacao SOBRE ESTA MAQUINA. Um caminho escrito num script versionado
# vale para quem o escreveu e para mais ninguem, e o AppImage tem 180 MB --
# nao entra no repositorio.
#
# O doctor ignora esta secao; quem a le e o qgc.sh, via `--get qgc.path`.
#
# qgc:
#   path: ~/Downloads/apps/QGroundControl-x86_64.AppImage
